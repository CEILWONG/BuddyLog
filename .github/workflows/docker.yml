name: Build & Push & Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "main.py"
      - "src/**"
      - "index.html"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/**"
  workflow_dispatch: # 允许在 GitHub 页面上手动触发

env:
  IMAGE_NAME: buddylog
  # ACR 中的命名空间/仓库名，与 ALIYUN_REGISTRY（仅域名）拼接成完整镜像地址
  ACR_IMAGE: ceilwong/buddylog

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Generate timestamp tag
        id: ts
        run: echo "timestamp=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 阿里云 ACR 不支持 provenance 证明清单，必须关闭，否则推送失败
          provenance: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.ts.outputs.timestamp }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_IMAGE }}:latest
            ${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_IMAGE }}:${{ steps.ts.outputs.timestamp }}
            ${{ secrets.ALIYUN_REGISTRY }}/${{ env.ACR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 镜像推送成功后，SSH 到云主机拉取新镜像并重启
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cloud server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            docker compose pull
            docker compose up -d
            docker image prune -f
